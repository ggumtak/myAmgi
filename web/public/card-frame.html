<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <title>myAmgi Card Frame</title>
    <link rel="stylesheet" href="/_anki/css/root-vars.css" />
    <link rel="stylesheet" href="/_anki/css/reviewer.css" />
    <link rel="stylesheet" href="/_anki/css/reviewer_extras.css" />
    <style id="amgi-base-css">
      :root {
        --card-font-scale: 1;
        --card-line-height: 1.6;
      }

      html.night-mode {
        --canvas: #141923;
        --canvas-elevated: #1C2333;
        --fg: #F2F5FA;
        --border: #252E3F;
      }

      html {
        margin: 0;
        padding: 0;
        overflow-x: clip;
        background-color: #ffffff;
        color: #111827;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 32px 22px 44px;
        box-sizing: border-box;
        overflow-x: clip;
        background-color: #ffffff;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans CJK KR", "Noto Sans KR", system-ui, sans-serif;
        font-size: calc(19px * var(--card-font-scale, 1));
        line-height: var(--card-line-height, 1.6);
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      /* Safe default whisper-thin scrollbar (Chromium/WebKit use ::-webkit-scrollbar; Firefox falls back via @supports) */
      @supports not selector(::-webkit-scrollbar) {
        html,
        body {
          scrollbar-width: thin;
          scrollbar-color: rgba(15, 23, 42, 0.14) transparent;
        }
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      html::-webkit-scrollbar-track,
      body::-webkit-scrollbar-track {
        background: transparent;
      }

      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.14);
        border-radius: 999px;
      }

      html::-webkit-scrollbar-thumb:hover,
      body::-webkit-scrollbar-thumb:hover {
        background: rgba(15, 23, 42, 0.28);
      }

      :where(#qa) {
        display: flow-root;
        max-width: 100%;
      }

      :where(.card) {
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans CJK KR", "Noto Sans KR", system-ui, sans-serif;
        font-size: calc(22px * var(--card-font-scale, 1));
        line-height: var(--card-line-height, 1.6);
        text-align: center;
        color: inherit;
        background-color: transparent;
      }

      :where(img, svg, video, canvas) {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
      }

      :where(img) {
        max-width: 100%;
        height: auto;
      }

      :where(.cloze) {
        font-weight: 800;
        color: #2f5bff;
        background-color: rgba(47, 91, 255, 0.09);
        padding: 1px 8px;
        border-radius: 7px;
      }

      :where(.cloze-inactive) {
        opacity: 0.62;
      }

      hr:where(#answer) {
        border: 0;
        border-top: 0;
        height: 1px;
        width: 100%;
        max-width: 100%;
        opacity: 1;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(15, 23, 42, 0.14) 16%,
          rgba(15, 23, 42, 0.14) 84%,
          transparent 100%
        );
        margin: 26px 0;
      }

      :where(input#typeans) {
        width: 100%;
        max-width: 480px;
        box-sizing: border-box;
        padding: 12px 15px;
        font-family: inherit;
        font-size: calc(16px * var(--card-font-scale, 1));
        line-height: 1.5;
        color: #111827;
        background-color: #f8fafc;
        border: 1.5px solid #cbd5e1;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      }

      :where(input#typeans:focus) {
        border-color: #2f5bff;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(47, 91, 255, 0.12);
      }

      :where(.replay-button) {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
        padding: 0;
        margin: 6px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.10);
        background-color: #f8fafc;
        color: #111827;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        text-decoration: none;
        cursor: pointer;
        vertical-align: middle;
        box-sizing: border-box;
        transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }

      :where(.replay-button:hover) {
        background-color: rgba(47, 91, 255, 0.08);
        border-color: rgba(47, 91, 255, 0.28);
        color: #2f5bff;
      }

      :where(.replay-button:active) {
        transform: scale(0.94);
      }

      :where(.replay-button svg) {
        width: 24px;
        height: 24px;
        display: block;
      }

      :where(.replay-button svg circle) {
        fill: transparent;
        stroke: none;
      }

      :where(.replay-button svg path) {
        fill: currentColor;
      }

      /* Dark theme — synced cleanly to #141923 card surface for zero seam */
      html.night-mode,
      html.night-mode body,
      body.nightMode {
        background-color: #141923;
        color: #f2f5fa;
      }

      @supports not selector(::-webkit-scrollbar) {
        html.night-mode,
        html.night-mode body,
        body.nightMode {
          scrollbar-color: rgba(242, 245, 250, 0.15) transparent;
        }
      }

      html.night-mode::-webkit-scrollbar-thumb,
      html.night-mode body::-webkit-scrollbar-thumb,
      body.nightMode::-webkit-scrollbar-thumb {
        background: rgba(242, 245, 250, 0.15);
      }

      html.night-mode::-webkit-scrollbar-thumb:hover,
      html.night-mode body::-webkit-scrollbar-thumb:hover,
      body.nightMode::-webkit-scrollbar-thumb:hover {
        background: rgba(242, 245, 250, 0.30);
      }

      :where(html.night-mode .card, body.nightMode .card) {
        background-color: #141923;
        color: #f2f5fa;
      }

      :where(html.night-mode .cloze, body.nightMode .cloze) {
        color: #6c9eff;
        background-color: rgba(108, 158, 255, 0.14);
      }

      html.night-mode hr:where(#answer),
      body.nightMode hr:where(#answer) {
        opacity: 1;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.16) 16%,
          rgba(255, 255, 255, 0.16) 84%,
          transparent 100%
        );
      }

      :where(html.night-mode input#typeans, body.nightMode input#typeans) {
        color: #f2f5fa;
        background-color: #1c2333;
        border-color: #2e3a50;
      }

      :where(html.night-mode input#typeans:focus, body.nightMode input#typeans:focus) {
        border-color: #6c9eff;
        background-color: #171d2b;
        box-shadow: 0 0 0 3px rgba(108, 158, 255, 0.16);
      }

      :where(html.night-mode .replay-button, body.nightMode .replay-button) {
        border-color: rgba(242, 245, 250, 0.14);
        background-color: rgba(242, 245, 250, 0.06);
        color: #f2f5fa;
        box-shadow: none;
      }

      :where(html.night-mode .replay-button:hover, body.nightMode .replay-button:hover) {
        background-color: rgba(108, 158, 255, 0.16);
        border-color: rgba(108, 158, 255, 0.36);
        color: #6c9eff;
      }

      /* Touch & stylus devices: completely hide Chromium scrollbar for distraction-free reading */
      @media (pointer: coarse), (hover: none) {
        html,
        body,
        html.night-mode,
        html.night-mode body,
        body.nightMode {
          scrollbar-width: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        html.night-mode::-webkit-scrollbar,
        html.night-mode body::-webkit-scrollbar,
        body.nightMode::-webkit-scrollbar {
          width: 0;
          height: 0;
          display: none;
        }
      }

      /* E-Ink theme: pure #FFFFFF bg, #000000 ink, zero transitions/animations, underlined .cloze */
      html.eink-mode,
      html.eink-mode body,
      body.einkMode {
        background-color: #ffffff;
        color: #000000;
        scrollbar-width: auto;
        scrollbar-color: auto;
      }

      @supports not selector(::-webkit-scrollbar) {
        html.eink-mode,
        html.eink-mode body,
        body.einkMode {
          scrollbar-width: thin;
          scrollbar-color: #000000 transparent;
        }
      }

      html.eink-mode::-webkit-scrollbar,
      html.eink-mode body::-webkit-scrollbar,
      body.einkMode::-webkit-scrollbar {
        width: 3px;
        height: 3px;
        display: block;
      }

      html.eink-mode::-webkit-scrollbar-track,
      html.eink-mode body::-webkit-scrollbar-track,
      body.einkMode::-webkit-scrollbar-track {
        background: transparent;
      }

      html.eink-mode::-webkit-scrollbar-thumb,
      html.eink-mode body::-webkit-scrollbar-thumb,
      body.einkMode::-webkit-scrollbar-thumb {
        background: #000000;
        border-radius: 0;
      }

      html.eink-mode .card,
      body.einkMode .card {
        background-color: #ffffff !important;
        color: #000000 !important;
      }

      html.eink-mode *,
      html.eink-mode *::before,
      html.eink-mode *::after,
      body.einkMode *,
      body.einkMode *::before,
      body.einkMode *::after {
        transition: none !important;
        animation: none !important;
        box-shadow: none !important;
        text-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      html.eink-mode .cloze,
      body.einkMode .cloze {
        color: #000000 !important;
        background-color: transparent !important;
        padding: 0 !important;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      html.eink-mode .cloze-inactive,
      body.einkMode .cloze-inactive {
        opacity: 1;
        text-decoration: underline dotted #000000;
      }

      html.eink-mode hr#answer,
      body.einkMode hr#answer {
        border: none;
        border-top: 2px solid #000000;
        background: transparent;
        height: 0;
        max-width: 100%;
        margin: 20px 0;
      }

      html.eink-mode input#typeans,
      body.einkMode input#typeans {
        background-color: #ffffff;
        color: #000000;
        border: 2px solid #000000;
        border-radius: 4px;
      }

      html.eink-mode .replay-button,
      body.einkMode .replay-button {
        background-color: #ffffff;
        color: #000000;
        border: 2px solid #000000;
        transform: none !important;
      }

      html.eink-mode a,
      body.einkMode a {
        color: #000000;
        text-decoration: underline;
      }

      html.eink-mode .typeGood,
      body.einkMode .typeGood {
        background-color: #ffffff !important;
        color: #000000 !important;
        border: 2px solid #000000;
        padding: 0 3px;
        font-weight: 700;
      }

      html.eink-mode .typeBad,
      body.einkMode .typeBad {
        background-color: #000000 !important;
        color: #ffffff !important;
        padding: 0 3px;
        font-weight: 700;
        text-decoration: line-through;
      }

      html.eink-mode .typeMissed,
      body.einkMode .typeMissed {
        background-color: #ffffff !important;
        color: #000000 !important;
        border-bottom: 2px dashed #000000;
        padding: 0 2px;
      }
    </style>
    <style id="amgi-card-css"></style>
  </head>
  <body class="card">
    <div id="_flag" hidden>⚑</div>
    <div id="_mark" hidden>★</div>
    <div id="qa"></div>

    <script src="/_anki/js/jquery.min.js"></script>
    <script src="/_anki/js/reviewer_extras_bundle.js"></script>
    <script src="/_anki/js/reviewer.js"></script>

    <script>
      (function () {
        'use strict';

        var state = {
          theme: 'light',
          fontScale: 1,
          lineHeight: 1.55,
          tapToFlip: true,
          hanjaEnabled: true,
          side: 'question',
          bodyClass: 'card',
        };

        var INTERACTIVE_SELECTOR = [
          'a',
          'button',
          'input',
          'textarea',
          'select',
          'audio',
          'video',
          '.tappable',
          '.hjtap',
          '.hjchip',
          '.replay-button',
          '[onclick]',
          '[contenteditable]',
        ].join(',');

        function postToParent(payload) {
          try {
            if (window.parent && window.parent !== window) {
              // Parent and frame are served by the same local host.
              window.parent.postMessage(payload, window.location.origin);
            }
          } catch (_) {
            // Ignore cross-origin postMessage errors
          }
        }

        function resolveTheme(theme) {
          if (theme === 'dark' || theme === 'eink' || theme === 'light') {
            return theme;
          }
          if (theme === 'auto') {
            try {
              if (
                window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
              ) {
                return 'dark';
              }
            } catch (_) {
              // Ignore matchMedia errors
            }
          }
          return 'light';
        }

        function computeBodyClass(baseClass) {
          var tokens = (baseClass || 'card').split(/\s+/).filter(Boolean);
          var filtered = tokens.filter(function (c) {
            return c !== 'nightMode' && c !== 'night_mode' && c !== 'einkMode' && c !== 'eink_mode';
          });
          if (filtered.length === 0) {
            filtered.push('card');
          }
          if (state.theme === 'dark') {
            filtered.push('nightMode');
          } else if (state.theme === 'eink') {
            filtered.push('einkMode');
          }
          return filtered.join(' ');
        }

        function applyTheme(theme) {
          state.theme = resolveTheme(theme);
          var root = document.documentElement;
          root.classList.toggle('night-mode', state.theme === 'dark');
          root.classList.toggle('eink-mode', state.theme === 'eink');
          root.setAttribute('data-bs-theme', state.theme === 'dark' ? 'dark' : 'light');
          root.setAttribute('data-theme', state.theme);
          if (document.body) {
            document.body.className = computeBodyClass(state.bodyClass);
          }
        }

        function applyFontScale(fontScale) {
          var num = Number(fontScale);
          if (!Number.isFinite(num) || num <= 0) num = 1;
          num = Math.max(0.5, Math.min(3, num));
          state.fontScale = num;
          document.documentElement.style.setProperty('--card-font-scale', String(num));
        }

        function applyLineHeight(lineHeight) {
          var num = Number(lineHeight);
          if (!Number.isFinite(num) || num <= 0) num = 1.55;
          num = Math.max(1.0, Math.min(3.0, num));
          state.lineHeight = num;
          document.documentElement.style.setProperty('--card-line-height', String(num));
        }

        function injectCardCss(css) {
          var el = document.getElementById('amgi-card-css');
          if (!el) {
            el = document.createElement('style');
            el.id = 'amgi-card-css';
            document.head.appendChild(el);
          }
          var next = typeof css === 'string' ? css : '';
          if (el.textContent !== next) {
            el.textContent = next;
          }
        }

        function parseHanjaHref(href) {
          if (!href) return null;
          var trimmed = String(href).trim();
          if (!/^(intent|hanja):\/\/lookup/i.test(trimmed)) return null;
          try {
            var qIndex = trimmed.indexOf('?');
            if (qIndex < 0) return null;
            var endIdx = trimmed.indexOf('#', qIndex);
            var query = endIdx >= 0 ? trimmed.slice(qIndex + 1, endIdx) : trimmed.slice(qIndex + 1);
            var params = new URLSearchParams(query);
            var text = params.get('q') || params.get('text') || '';
            var sentence = params.get('s') || params.get('sentence') || '';
            if (!text) return null;
            return { text: text, sentence: sentence };
          } catch (_) {
            return null;
          }
        }

        function extractSoundTag(el) {
          if (!el) return '';
          var dataSound = el.getAttribute('data-myamgi-sound') || el.getAttribute('data-sound');
          if (dataSound) return dataSound;
          var href = el.getAttribute('href') || '';
          if (href.indexOf('playsound:') === 0) {
            try {
              return decodeURIComponent(href.slice('playsound:'.length));
            } catch (_) {
              return href.slice('playsound:'.length);
            }
          }
          var onclickAttr = el.getAttribute('onclick') || '';
          var pycmdMatch = onclickAttr.match(/pycmd\s*\(\s*['"]play:([^'"]+)['"]\s*\)/);
          if (pycmdMatch && pycmdMatch[1]) return pycmdMatch[1];
          return '';
        }

        function emitTypedAnswer(value) {
          postToParent({
            type: 'typeAnsSubmit',
            value: typeof value === 'string' ? value : getCurrentTypedAnswer(),
          });
        }

        function getCurrentTypedAnswer() {
          if (typeof window.getTypedAnswer === 'function') {
            var v = window.getTypedAnswer();
            if (typeof v === 'string') return v;
          }
          var input = document.getElementById('typeans');
          return input && 'value' in input ? String(input.value || '') : '';
        }

        // Intercept official Anki reviewer bridge commands (including Enter on #typeans -> bridgeCommand('ans'))
        window.bridgeCommand = function (cmd) {
          if (typeof cmd !== 'string') return;
          if (cmd === 'ans') {
            emitTypedAnswer();
            return;
          }
          if (cmd.indexOf('play:') === 0) {
            postToParent({ type: 'playSound', tag: cmd.slice(5) });
            return;
          }
          if (/^ease([1-4])$/.test(cmd)) {
            postToParent({ type: 'bridgeCommand', cmd: cmd });
            return;
          }
          if (cmd === 'updateToolbar' || cmd === 'repaintNeeded') {
            return;
          }
          postToParent({ type: 'bridgeCommand', cmd: cmd });
        };

        window.pycmd = window.bridgeCommand;

        // Intercept hanja lookup links and .replay-button / playsound: clicks in capture phase
        document.addEventListener(
          'click',
          function (event) {
            var target = event.target;
            if (!target) return;
            if (target.nodeType === 3) target = target.parentElement;
            if (!target || !target.closest) return;

            var anchor = target.closest('a[href]');
            if (anchor) {
              var href = anchor.getAttribute('href') || '';
              var lookup = parseHanjaHref(href);
              if (lookup) {
                event.preventDefault();
                event.stopPropagation();
                postToParent({
                  type: 'hanjaLookup',
                  text: lookup.text,
                  sentence: lookup.sentence,
                });
                return;
              }
            }

            var soundEl = target.closest('.replay-button, a[href^="playsound:"], [data-myamgi-sound]');
            if (soundEl) {
              var tag = extractSoundTag(soundEl);
              if (tag || soundEl.matches('.replay-button, a[href^="playsound:"]')) {
                event.preventDefault();
                event.stopPropagation();
                postToParent({ type: 'playSound', tag: tag });
                return;
              }
            }
          },
          true
        );

        // Also handle #typeans Enter even if a deck template didn't bind onkeypress="_typeAnsPress()"
        document.addEventListener(
          'keydown',
          function (event) {
            var target = event.target;
            if (target && target.id === 'typeans' && event.key === 'Enter' && !event.isComposing) {
              event.preventDefault();
              event.stopPropagation();
              emitTypedAnswer(target.value || '');
            }
          },
          true
        );

        function isEditableTarget(el) {
          if (!el || el.nodeType !== 1) return false;
          var tag = el.tagName;
          return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable === true;
        }

        // Forward reviewer shortcuts (Space, 1-4, Enter, Ctrl+Z, ...) to the app: once the
        // card has been tapped, keyboard focus lives in this frame, not the top window.
        var MODIFIER_KEYS = { Shift: 1, Control: 1, Alt: 1, Meta: 1, AltGraph: 1, CapsLock: 1 };
        document.addEventListener(
          'keydown',
          function (event) {
            if (event.defaultPrevented || event.isComposing) return;
            var key = event.key;
            if (!key || MODIFIER_KEYS[key]) return;
            var target = event.target;
            if (target && target.nodeType === 3) target = target.parentElement;
            if (isEditableTarget(target)) return;
            var activatesTarget =
              (key === ' ' || key === 'Enter') &&
              target &&
              target.closest &&
              target.closest('a[href], button, audio, video, [role="button"]');
            if (activatesTarget) return;
            if (key === ' ' || key === 'Enter') {
              // Do not scroll the card; the app decides what Space/Enter do.
              event.preventDefault();
            }
            postToParent({
              type: 'key',
              key: key,
              code: event.code || '',
              shift: !!event.shiftKey,
              ctrl: !!event.ctrlKey,
              meta: !!event.metaKey,
              alt: !!event.altKey,
            });
          },
          false
        );

        // Report focus of inputs inside the card (type-in-answer) so the Android shell lets
        // volume / D-pad keys reach the input instead of answering the card.
        var inputFocused = false;
        function setInputFocused(next) {
          if (next === inputFocused) return;
          inputFocused = next;
          postToParent({ type: 'inputFocus', focused: next });
        }
        document.addEventListener(
          'focusin',
          function (event) {
            setInputFocused(isEditableTarget(event.target));
          },
          true
        );
        document.addEventListener(
          'focusout',
          function (event) {
            // relatedTarget is the element receiving focus inside this document, if any.
            setInputFocused(isEditableTarget(event.relatedTarget));
          },
          true
        );

        // Drag-safe (< 18px) and selection-safe tap-to-flip
        var pointerStart = null;

        document.addEventListener(
          'pointerdown',
          function (event) {
            if (event.button !== undefined && event.button !== 0) {
              pointerStart = null;
              return;
            }
            pointerStart = { x: event.clientX || 0, y: event.clientY || 0 };
          },
          { passive: true }
        );

        document.addEventListener(
          'click',
          function (event) {
            if (!state.tapToFlip) return;
            if (event.defaultPrevented) return;

            var sel = window.getSelection ? window.getSelection() : null;
            if (sel && !sel.isCollapsed && String(sel).trim().length > 0) return;

            if (pointerStart) {
              var dx = Math.abs((event.clientX || 0) - pointerStart.x);
              var dy = Math.abs((event.clientY || 0) - pointerStart.y);
              pointerStart = null;
              if (dx >= 18 || dy >= 18) return;
            }

            var target = event.target;
            if (!target) return;
            if (target.nodeType === 3) target = target.parentElement;
            if (!target || !target.closest) return;
            if (target.closest(INTERACTIVE_SELECTOR)) return;

            postToParent({ type: 'cardTap' });
          },
          false
        );

        function triggerHanjaTap() {
          if (state.hanjaEnabled === false) return;
          if (typeof window.__hjtapRun === 'function') {
            try {
              window.__hjtapRun();
              return;
            } catch (_) {
              // Ignore Hanja tap errors
            }
          }
          if (window.__hjCode && typeof window.__hjCode === 'object') {
            var best = 0;
            for (var k in window.__hjCode) {
              if (Object.prototype.hasOwnProperty.call(window.__hjCode, k) && +k > best) {
                best = +k;
              }
            }
            if (best && typeof window.__hjCode[best] === 'function') {
              try {
                window.__hjCode[best]();
              } catch (_) {
                // Ignore Hanja runner errors
              }
            }
          }
        }

        // Load /api/host/hanja-tap.js dynamically & non-blockingly
        function loadHanjaScript() {
          if (state.hanjaEnabled === false) return;
          var script = document.createElement('script');
          script.src = '/api/host/hanja-tap.js';
          script.async = true;
          script.onload = function () {
            triggerHanjaTap();
          };
          script.onerror = function () {
            // Ignore when empty/offline/unavailable
          };
          document.head.appendChild(script);
        }

        function handleRender(msg) {
          // The card DOM is about to be replaced; removed inputs do not reliably blur.
          setInputFocused(false);
          state.side = msg.side === 'answer' ? 'answer' : 'question';
          if (typeof msg.bodyClass === 'string' && msg.bodyClass.trim()) {
            state.bodyClass = msg.bodyClass;
          } else {
            state.bodyClass = 'card';
          }
          if (typeof msg.tapToFlip === 'boolean') {
            state.tapToFlip = msg.tapToFlip;
          }
          if (typeof msg.hanjaEnabled === 'boolean') {
            state.hanjaEnabled = msg.hanjaEnabled;
          }
          if (msg.theme !== undefined) {
            applyTheme(msg.theme);
          } else {
            applyTheme(state.theme);
          }
          if (msg.fontScale !== undefined) {
            applyFontScale(msg.fontScale);
          }
          if (msg.lineHeight !== undefined) {
            applyLineHeight(msg.lineHeight);
          }

          injectCardCss(msg.css || '');

          var nextBodyClass = computeBodyClass(state.bodyClass);
          var html = typeof msg.html === 'string' ? msg.html : '';
          var preloadAnswerHtml =
            typeof msg.preloadAnswerHtml === 'string' ? msg.preloadAnswerHtml : '';

          var resetShortCardScroll = function () {
            if (document.documentElement.scrollHeight <= window.innerHeight + 64) {
              window.scrollTo(0, 0);
            }
          };

          var runAfterUpdate = function () {
            triggerHanjaTap();
            // Schedule a post-render scan after reviewer.js finishes its queued DOM update
            setTimeout(triggerHanjaTap, 0);
            if (state.side === 'answer') {
              setTimeout(resetShortCardScroll, 0);
            }
            postToParent({ type: 'rendered', side: state.side });
          };

          // reviewer.js queues the update and its _updateQA starts by clearing onShownHook,
          // so hooks pushed here would never run; runAfterUpdate's timers do the work.
          if (state.side === 'answer' && typeof window._showAnswer === 'function') {
            window._showAnswer(html, nextBodyClass);
            setTimeout(resetShortCardScroll, 0);
            runAfterUpdate();
          } else if (typeof window._showQuestion === 'function') {
            window._showQuestion(html, preloadAnswerHtml, nextBodyClass);
            runAfterUpdate();
          } else {
            var qa = document.getElementById('qa');
            if (qa) qa.innerHTML = html;
            if (document.body) document.body.className = nextBodyClass;
            runAfterUpdate();
          }
        }

        window.addEventListener('message', function (event) {
          // Only the app that embeds this frame may drive it.
          if (!event || event.source !== window.parent) return;
          if (event.origin !== window.location.origin) return;
          var msg = event.data;
          if (!msg || typeof msg !== 'object') return;

          switch (msg.type) {
            case 'render':
              handleRender(msg);
              break;
            case 'setTheme':
              applyTheme(msg.theme);
              break;
            case 'setFontScale':
              applyFontScale(msg.fontScale);
              break;
            case 'setLineHeight':
              applyLineHeight(msg.lineHeight);
              break;
            case 'hanjaKey': {
              var fnName =
                msg.action === 'open'
                  ? 'userJs1'
                  : msg.action === 'next'
                    ? 'userJs2'
                    : msg.action === 'prev'
                      ? 'userJs3'
                      : null;
              if (fnName && typeof window[fnName] === 'function') {
                try {
                  window[fnName]();
                } catch (_) {
                  // Ignore userJs errors
                }
              }
              break;
            }
            case 'getTypedAnswer':
              postToParent({
                type: 'typedAnswer',
                value: getCurrentTypedAnswer(),
              });
              break;
            default:
              break;
          }
        });

        // Apply optional initial URL query params (?theme=...&fontScale=...&lineHeight=...)
        try {
          var qs = new URLSearchParams(window.location.search);
          var initialTheme = qs.get('theme');
          if (initialTheme) applyTheme(initialTheme);
          var initialScale = qs.get('fontScale');
          if (initialScale) applyFontScale(initialScale);
          var initialLineHeight = qs.get('lineHeight');
          if (initialLineHeight) applyLineHeight(initialLineHeight);
          var initialHanja = qs.get('hanjaEnabled');
          if (initialHanja === 'false' || initialHanja === '0') state.hanjaEnabled = false;
        } catch (_) {
          // Ignore query parse errors
        }

        loadHanjaScript();
        postToParent({ type: 'frameReady' });
      })();
    </script>
  </body>
</html>
