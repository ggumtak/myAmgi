<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>myAmgi 대용량 편집기</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-alt: #eef1f5;
      --text: #1c1b1f;
      --text-muted: #5f6368;
      --border: #d0d7de;
      --accent: #0b57d0;
      --accent-text: #ffffff;
      --dirty: #c5221f;
      --saved: #137333;
      --editor-bg: #ffffff;
      --editor-font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }

    html.dark {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-alt: #2a2a2a;
      --text: #ececec;
      --text-muted: #a8abb2;
      --border: #3c4043;
      --accent: #8ab4f8;
      --accent-text: #111111;
      --dirty: #f28b82;
      --saved: #81c995;
      --editor-bg: #161616;
    }

    html.eink {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-alt: #ffffff;
      --text: #000000;
      --text-muted: #000000;
      --border: #000000;
      --accent: #000000;
      --accent-text: #ffffff;
      --dirty: #000000;
      --saved: #000000;
      --editor-bg: #ffffff;
    }

    html.eink *,
    html.eink *::before,
    html.eink *::after {
      animation: none !important;
      transition: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
      border-radius: 2px !important;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", Roboto, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    html.eink .toolbar {
      border-bottom-width: 2px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-row {
      justify-content: space-between;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-strong {
      color: var(--text);
      font-weight: 600;
    }

    .dirty-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      color: var(--saved);
      background: var(--surface-alt);
    }

    .dirty-badge.is-dirty {
      color: var(--dirty);
      border-color: var(--dirty);
    }

    html.eink .dirty-badge.is-dirty {
      background: #000000;
      color: #ffffff;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button, select, input[type="text"], input[type="search"] {
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      min-height: 30px;
      outline: none;
    }

    html.eink button,
    html.eink select,
    html.eink input[type="text"],
    html.eink input[type="search"] {
      border-width: 2px;
      background: #ffffff;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    button.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .chunk-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .chunk-nav.hidden {
      display: none;
    }

    .chunk-select {
      max-width: 165px;
    }

    .chunk-slider {
      flex: 1;
      min-width: 80px;
      accent-color: var(--accent);
      height: 24px;
    }

    .chunk-label {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      min-width: 68px;
      text-align: center;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      min-width: 110px;
      background: var(--editor-bg);
    }

    .match-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 52px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .editor-wrap {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--editor-bg);
    }

    .chunk-meta-strip {
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 10px 12px;
      resize: none;
      outline: none;
      background: var(--editor-bg);
      color: var(--text);
      font-family: var(--editor-font);
      font-size: 13px;
      line-height: 1.5;
      tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 0.94;
    }

    html.eink .toast {
      border: 2px solid #000000;
      background: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="row status-row">
        <div class="stats">
          <span id="docTitle" class="stat-strong">편집기</span>
          <span>총 <strong id="totalChars">0</strong>자</span>
          <span><strong id="totalLines">1</strong>줄</span>
          <span id="dirtyBadge" class="dirty-badge">저장됨</span>
        </div>
        <div class="actions">
          <button id="toggleFullBtn" type="button" title="30,000자 미만 소형 템플릿 전체 보기 전환">전체 보기</button>
          <button id="saveBtn" type="button" class="primary">저장</button>
        </div>
      </div>

      <div id="chunkNav" class="chunk-nav">
        <button id="prevChunkBtn" type="button" aria-label="이전 청크">◀ 이전</button>
        <span id="chunkLabel" class="chunk-label">1 / 1</span>
        <button id="nextChunkBtn" type="button" aria-label="다음 청크">다음 ▶</button>
        <input id="chunkSlider" class="chunk-slider" type="range" min="0" max="0" value="0" aria-label="청크 이동 슬라이더">
        <select id="chunkSelect" class="chunk-select" aria-label="청크 선택"></select>
      </div>

      <div class="search-row">
        <input id="searchInput" class="search-input" type="search" placeholder="전체 텍스트 검색 (Enter: 다음)" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span id="matchCount" class="match-count">0 / 0</span>
        <button id="prevMatchBtn" type="button" title="이전 검색 결과">▲</button>
        <button id="nextMatchBtn" type="button" title="다음 검색 결과">▼</button>
      </div>
    </header>

    <main class="editor-wrap">
      <div class="chunk-meta-strip">
        <span id="chunkRangeInfo">청크 1 (0 ~ 0자)</span>
        <span id="modeInfo">청크 모드 (8KB)</span>
      </div>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="내용을 불러오는 중..."></textarea>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      var CHUNK_SIZE = 8192;
      var SMALL_TEMPLATE_THRESHOLD = 30000;
      var FULL_VIEW_HARD_LIMIT = 120000;
      var SAVE_STREAM_SIZE = 8192;

      var state = {
        chunks: [''],
        lineCounts: [0],
        currentChunk: 0,
        fullMode: false,
        dirty: false,
        readOnly: false,
        title: '템플릿 편집기',
        incomingTail: '',
        incomingChunks: [],
        matches: [],
        matchIndex: -1,
        lastSearchQuery: ''
      };

      var elEditor = document.getElementById('editor');
      var elDocTitle = document.getElementById('docTitle');
      var elTotalChars = document.getElementById('totalChars');
      var elTotalLines = document.getElementById('totalLines');
      var elDirtyBadge = document.getElementById('dirtyBadge');
      var elToggleFullBtn = document.getElementById('toggleFullBtn');
      var elSaveBtn = document.getElementById('saveBtn');
      var elChunkNav = document.getElementById('chunkNav');
      var elPrevChunkBtn = document.getElementById('prevChunkBtn');
      var elNextChunkBtn = document.getElementById('nextChunkBtn');
      var elChunkLabel = document.getElementById('chunkLabel');
      var elChunkSlider = document.getElementById('chunkSlider');
      var elChunkSelect = document.getElementById('chunkSelect');
      var elChunkRangeInfo = document.getElementById('chunkRangeInfo');
      var elModeInfo = document.getElementById('modeInfo');
      var elSearchInput = document.getElementById('searchInput');
      var elMatchCount = document.getElementById('matchCount');
      var elPrevMatchBtn = document.getElementById('prevMatchBtn');
      var elNextMatchBtn = document.getElementById('nextMatchBtn');
      var elToast = document.getElementById('toast');

      var toastTimer = null;

      function showToast(msg) {
        if (!elToast) return;
        elToast.textContent = msg;
        elToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          elToast.classList.remove('show');
        }, 1800);
      }

      function applyThemeFromParams(meta) {
        var params = new URLSearchParams(window.location.search || '');
        var isEink = params.get('eink') === '1' || Boolean(meta && meta.eink);
        var isDark = !isEink && (params.get('dark') === '1' || Boolean(meta && meta.dark));
        document.documentElement.classList.toggle('eink', isEink);
        document.documentElement.classList.toggle('dark', isDark);
      }

      function countNewlines(str) {
        var count = 0;
        var idx = -1;
        while ((idx = str.indexOf('\n', idx + 1)) !== -1) {
          count++;
        }
        return count;
      }

      function splitIntoChunks(text) {
        if (!text) return [''];
        var out = [];
        for (var i = 0; i < text.length; i += CHUNK_SIZE) {
          out.push(text.slice(i, i + CHUNK_SIZE));
        }
        return out;
      }

      function recomputeAllLineCounts() {
        state.lineCounts = new Array(state.chunks.length);
        for (var i = 0; i < state.chunks.length; i++) {
          state.lineCounts[i] = countNewlines(state.chunks[i]);
        }
      }

      function getTotalChars() {
        var total = 0;
        for (var i = 0; i < state.chunks.length; i++) {
          total += state.chunks[i].length;
        }
        return total;
      }

      function getTotalLines() {
        var lines = 1;
        for (var i = 0; i < state.lineCounts.length; i++) {
          lines += state.lineCounts[i];
        }
        return lines;
      }

      function getChunkStartChar(index) {
        var offset = 0;
        for (var i = 0; i < index; i++) {
          offset += state.chunks[i].length;
        }
        return offset;
      }

      function getChunkStartLine(index) {
        var line = 1;
        for (var i = 0; i < index; i++) {
          line += state.lineCounts[i];
        }
        return line;
      }

      function setDirty(flag) {
        var next = Boolean(flag);
        if (state.dirty === next) return;
        state.dirty = next;
        updateDirtyUI();
        if (window.EditorBridge && typeof window.EditorBridge.onDirtyChanged === 'function') {
          try {
            window.EditorBridge.onDirtyChanged(next);
          } catch (e) {}
        }
      }

      function updateDirtyUI() {
        elDirtyBadge.textContent = state.dirty ? '● 수정됨' : '저장됨';
        elDirtyBadge.classList.toggle('is-dirty', state.dirty);
      }

      function updateStatsUI() {
        var totalChars = getTotalChars();
        var totalLines = getTotalLines();
        elTotalChars.textContent = totalChars.toLocaleString('en-US');
        elTotalLines.textContent = totalLines.toLocaleString('en-US');
        updateDirtyUI();

        if (state.fullMode) {
          elModeInfo.textContent = '전체 보기 (소형 < 30,000자)';
          elChunkRangeInfo.textContent =
            '전체 ' + totalChars.toLocaleString('en-US') + '자 · 1~' + totalLines.toLocaleString('en-US') + '줄';
        } else {
          var idx = state.currentChunk;
          var len = state.chunks[idx] ? state.chunks[idx].length : 0;
          var startChar = getChunkStartChar(idx);
          var endChar = startChar + len;
          var startLine = getChunkStartLine(idx);
          var endLine = startLine + (state.lineCounts[idx] || 0);
          elModeInfo.textContent = '청크 모드 (8KB 단위)';
          elChunkRangeInfo.textContent =
            '청크 ' + (idx + 1) + '/' + state.chunks.length +
            ' · ' + startChar.toLocaleString('en-US') + '~' + endChar.toLocaleString('en-US') + '자' +
            ' · ' + startLine.toLocaleString('en-US') + '~' + endLine.toLocaleString('en-US') + '줄';
        }
      }

      function rebuildChunkSelect() {
        var frag = document.createDocumentFragment();
        var runningOffset = 0;
        for (var i = 0; i < state.chunks.length; i++) {
          var opt = document.createElement('option');
          var len = state.chunks[i].length;
          var endOffset = runningOffset + len;
          opt.value = String(i);
          opt.textContent = (i + 1) + ' (' + runningOffset.toLocaleString('en-US') + '~' + endOffset.toLocaleString('en-US') + ')';
          frag.appendChild(opt);
          runningOffset = endOffset;
        }
        elChunkSelect.innerHTML = '';
        elChunkSelect.appendChild(frag);
        elChunkSelect.value = String(state.currentChunk);
      }

      function updateChunkNavUI() {
        var count = state.chunks.length;
        var idx = state.currentChunk;

        elChunkNav.classList.toggle('hidden', state.fullMode);
        elToggleFullBtn.classList.toggle('active', state.fullMode);
        elToggleFullBtn.textContent = state.fullMode ? '청크 분할' : '전체 보기 (소형)';

        elChunkLabel.textContent = (idx + 1) + ' / ' + count;
        elPrevChunkBtn.disabled = idx <= 0;
        elNextChunkBtn.disabled = idx >= count - 1;
        elChunkSlider.min = '0';
        elChunkSlider.max = String(Math.max(0, count - 1));
        elChunkSlider.value = String(idx);
        elChunkSlider.disabled = count <= 1;

        if (elChunkSelect.options.length !== count) {
          rebuildChunkSelect();
        } else {
          elChunkSelect.value = String(idx);
        }
      }

      function commitEditorToState() {
        var val = elEditor.value;
        if (state.fullMode) {
          state.chunks = splitIntoChunks(val);
          recomputeAllLineCounts();
          if (state.currentChunk >= state.chunks.length) {
            state.currentChunk = Math.max(0, state.chunks.length - 1);
          }
        } else {
          state.chunks[state.currentChunk] = val;
          state.lineCounts[state.currentChunk] = countNewlines(val);
        }
      }

      function renderActiveChunk(resetScroll) {
        if (state.fullMode) {
          elEditor.value = state.chunks.join('');
        } else {
          elEditor.value = state.chunks[state.currentChunk] || '';
        }
        if (resetScroll) {
          elEditor.scrollTop = 0;
        }
        updateChunkNavUI();
        updateStatsUI();
      }

      function goToChunk(index, resetScroll) {
        if (state.fullMode) return;
        commitEditorToState();
        var clamped = Math.max(0, Math.min(state.chunks.length - 1, index));
        state.currentChunk = clamped;
        renderActiveChunk(resetScroll !== false);
      }

      function toggleFullMode() {
        commitEditorToState();
        var totalChars = getTotalChars();
        if (!state.fullMode && totalChars > FULL_VIEW_HARD_LIMIT) {
          showToast('대용량 문서(' + totalChars.toLocaleString('en-US') + '자)는 청크 모드로만 편집됩니다');
          return;
        }
        state.fullMode = !state.fullMode;
        if (!state.fullMode) {
          state.currentChunk = 0;
        }
        renderActiveChunk(true);
      }

      function getFullText() {
        commitEditorToState();
        return state.chunks.join('');
      }

      function mapGlobalOffsetToChunk(globalOffset) {
        var acc = 0;
        for (var i = 0; i < state.chunks.length; i++) {
          var len = state.chunks[i].length;
          if (globalOffset < acc + len || i === state.chunks.length - 1) {
            return {
              chunkIndex: i,
              localOffset: Math.max(0, globalOffset - acc)
            };
          }
          acc += len;
        }
        return { chunkIndex: 0, localOffset: 0 };
      }

      function scrollTextareaToOffset(textarea, text, charIndex) {
        var before = text.slice(0, charIndex);
        var lineNumber = countNewlines(before);
        var computed = window.getComputedStyle ? window.getComputedStyle(textarea) : null;
        var lineHeight = computed ? parseFloat(computed.lineHeight) : 19.5;
        if (!lineHeight || isNaN(lineHeight)) lineHeight = 19.5;
        var targetTop = Math.max(0, lineNumber * lineHeight - textarea.clientHeight * 0.3);
        textarea.scrollTop = targetTop;
      }

      function runSearch(query, autoJump) {
        state.lastSearchQuery = query;
        state.matches = [];
        state.matchIndex = -1;

        if (!query) {
          elMatchCount.textContent = '0 / 0';
          return;
        }

        var fullText = getFullText();
        var pos = 0;
        var qLen = query.length;
        var MAX_MATCHES = 10000;

        while (state.matches.length < MAX_MATCHES) {
          var found = fullText.indexOf(query, pos);
          if (found === -1) break;
          state.matches.push({ start: found, end: found + qLen });
          pos = found + Math.max(1, qLen);
        }

        if (state.matches.length === 0) {
          elMatchCount.textContent = '0 / 0';
          if (autoJump) showToast('검색 결과가 없습니다');
          return;
        }

        if (autoJump) {
          jumpToMatch(0);
        } else {
          elMatchCount.textContent = '0 / ' + state.matches.length;
        }
      }

      function jumpToMatch(index) {
        if (!state.matches.length) return;
        var total = state.matches.length;
        var wrapped = ((index % total) + total) % total;
        state.matchIndex = wrapped;

        var m = state.matches[wrapped];
        elMatchCount.textContent = (wrapped + 1) + ' / ' + total;

        if (state.fullMode) {
          elEditor.focus();
          elEditor.setSelectionRange(m.start, m.end);
          scrollTextareaToOffset(elEditor, elEditor.value, m.start);
          return;
        }

        var loc = mapGlobalOffsetToChunk(m.start);
        if (state.currentChunk !== loc.chunkIndex) {
          commitEditorToState();
          state.currentChunk = loc.chunkIndex;
          renderActiveChunk(false);
        }

        var chunkText = elEditor.value;
        var localEnd = Math.min(chunkText.length, loc.localOffset + (m.end - m.start));
        elEditor.focus();
        elEditor.setSelectionRange(loc.localOffset, localEnd);
        scrollTextareaToOffset(elEditor, chunkText, loc.localOffset);
      }

      function stepMatch(delta) {
        var q = elSearchInput.value;
        if (!q) {
          runSearch('', false);
          return;
        }
        if (q !== state.lastSearchQuery || state.matches.length === 0) {
          runSearch(q, true);
          return;
        }
        jumpToMatch(state.matchIndex + delta);
      }

      function saveToNative() {
        commitEditorToState();
        var fullText = state.chunks.join('');
        var bridge = window.EditorBridge;

        if (!bridge || typeof bridge.beginSave !== 'function' || typeof bridge.appendSaveChunk !== 'function' || typeof bridge.commitSave !== 'function') {
          showToast('저장 브리지 연결 없음 (' + fullText.length.toLocaleString('en-US') + '자)');
          return false;
        }

        try {
          bridge.beginSave();
          for (var i = 0; i < fullText.length; i += SAVE_STREAM_SIZE) {
            bridge.appendSaveChunk(fullText.slice(i, i + SAVE_STREAM_SIZE));
          }
          bridge.commitSave();
          setDirty(false);
          showToast('저장 완료 (' + fullText.length.toLocaleString('en-US') + '자)');
          return true;
        } catch (err) {
          showToast('저장 오류: ' + (err && err.message ? err.message : String(err)));
          return false;
        }
      }

      // Native streaming ingestion API
      window.__editorReset = function (meta) {
        if (typeof meta === 'string') {
          try {
            meta = JSON.parse(meta);
          } catch (e) {
            meta = {};
          }
        }
        meta = meta || {};
        applyThemeFromParams(meta);

        state.title = meta.title ? String(meta.title) : '템플릿 편집기';
        state.readOnly = Boolean(meta.readOnly);
        state.incomingTail = '';
        state.incomingChunks = [];
        state.chunks = [''];
        state.lineCounts = [0];
        state.currentChunk = 0;
        state.fullMode = false;
        state.matches = [];
        state.matchIndex = -1;
        state.lastSearchQuery = '';

        elDocTitle.textContent = state.title;
        elEditor.readOnly = state.readOnly;
        elSaveBtn.disabled = state.readOnly;
        elSearchInput.value = '';
        elMatchCount.textContent = '0 / 0';
        setDirty(false);
        elEditor.value = '';
        updateStatsUI();
      };

      window.__editorAppendChunk = function (str) {
        if (typeof str !== 'string' || str.length === 0) return;
        var combined = state.incomingTail + str;
        var offset = 0;
        while (combined.length - offset >= CHUNK_SIZE) {
          state.incomingChunks.push(combined.slice(offset, offset + CHUNK_SIZE));
          offset += CHUNK_SIZE;
        }
        state.incomingTail = combined.slice(offset);
      };

      window.__editorReady = function () {
        if (state.incomingTail.length > 0) {
          state.incomingChunks.push(state.incomingTail);
          state.incomingTail = '';
        }

        state.chunks = state.incomingChunks.length > 0 ? state.incomingChunks : [''];
        state.incomingChunks = [];
        recomputeAllLineCounts();

        var totalChars = getTotalChars();
        state.fullMode = totalChars < SMALL_TEMPLATE_THRESHOLD;
        state.currentChunk = 0;

        elEditor.placeholder = '';
        rebuildChunkSelect();
        renderActiveChunk(true);
        setDirty(false);
      };

      window.__editorGetDirty = function () {
        return state.dirty;
      };

      window.__editorTriggerSave = function () {
        return saveToNative();
      };

      window.__editorGetStats = function () {
        commitEditorToState();
        return {
          totalChars: getTotalChars(),
          totalLines: getTotalLines(),
          chunkCount: state.chunks.length,
          currentChunk: state.currentChunk,
          fullMode: state.fullMode,
          dirty: state.dirty
        };
      };

      // Event bindings
      elEditor.addEventListener('input', function () {
        if (state.fullMode) {
          state.chunks = splitIntoChunks(elEditor.value);
          recomputeAllLineCounts();
        } else {
          state.chunks[state.currentChunk] = elEditor.value;
          state.lineCounts[state.currentChunk] = countNewlines(elEditor.value);
        }
        setDirty(true);
        updateStatsUI();
        if (state.lastSearchQuery) {
          state.matches = [];
          state.matchIndex = -1;
          elMatchCount.textContent = '0 / 0';
        }
      });

      elPrevChunkBtn.addEventListener('click', function () {
        goToChunk(state.currentChunk - 1, true);
      });

      elNextChunkBtn.addEventListener('click', function () {
        goToChunk(state.currentChunk + 1, true);
      });

      elChunkSlider.addEventListener('input', function () {
        var idx = parseInt(elChunkSlider.value, 10);
        if (!isNaN(idx)) {
          goToChunk(idx, true);
        }
      });

      elChunkSelect.addEventListener('change', function () {
        var idx = parseInt(elChunkSelect.value, 10);
        if (!isNaN(idx)) {
          goToChunk(idx, true);
        }
      });

      elToggleFullBtn.addEventListener('click', toggleFullMode);
      elSaveBtn.addEventListener('click', saveToNative);

      var searchDebounce = null;
      elSearchInput.addEventListener('input', function () {
        clearTimeout(searchDebounce);
        var q = elSearchInput.value;
        searchDebounce = setTimeout(function () {
          runSearch(q, false);
        }, 120);
      });

      elSearchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          stepMatch(e.shiftKey ? -1 : 1);
        }
      });

      elPrevMatchBtn.addEventListener('click', function () {
        stepMatch(-1);
      });

      elNextMatchBtn.addEventListener('click', function () {
        stepMatch(1);
      });

      // Initialize theme & empty ready state
      applyThemeFromParams(null);
      updateChunkNavUI();
      updateStatsUI();
    })();
  </script>
</body>
</html>
