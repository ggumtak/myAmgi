name: Build myAmgi APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_apk:
        description: 'Build and publish APKs even if only UI files changed'
        type: boolean
        default: false
      allow_new_signing_key:
        description: 'DANGER: generate a NEW signing key if none is cached (existing installs cannot upgrade)'
        type: boolean
        default: false
  # Keep the cached signing key alive: GitHub evicts cache entries unused for 7 days,
  # and regenerating a key would prevent in-place APK upgrades over existing installs.
  schedule:
    - cron: '41 5 */3 * *'

permissions:
  contents: write
  # Read-only: the build-mode step checks that the run which published the current APKs succeeded.
  actions: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'schedule' && 'keepalive' || 'build' }}
  # Never cancel mid-publish: stale release files are deleted only after the new ones are uploaded.
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the build-mode step diffs HEAD against tag `latest`.
          fetch-depth: 0

      # apk_needed=false ("OTA-only") only when every file changed since the commit of the published
      # APKs (tag `latest`) is UI-only. Then only ui-version.json + ui-bundle.zip are published to
      # update-files. Anything else, or any doubt, builds and publishes APKs as before.
      # Later steps test `!= 'false'`, so a missing output also means a full APK build.
      - name: Decide build mode (APK or OTA-only UI)
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_APK: ${{ inputs.force_apk && 'true' || 'false' }}
        run: |
          decide() { # apk_needed reason
            echo "apk_needed=$1" >> "$GITHUB_OUTPUT"
            if [ "$1" = "true" ]; then mode="full APK build"; else mode="OTA-only (UI bundle only, no APK)"; fi
            echo "Build mode: ${mode} - $2"
            {
              echo "### Build mode: ${mode}"
              echo ""
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$FORCE_APK" = "true" ]; then
            decide true "workflow_dispatch input force_apk=true"
            exit 0
          fi
          if ! base="$(git rev-parse -q --verify 'refs/tags/latest^{commit}')"; then
            decide true "tag 'latest' not found (no previous APK release)"
            exit 0
          fi
          # The tag moves before the APK upload; only trust it when that run finished successfully.
          if ! ok_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${base}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select((.path // "" | startswith(".github/workflows/build.yml")) and (.event == "push" or .event == "workflow_dispatch"))] | length')"; then
            decide true "could not look up the run that published tag 'latest' (${base})"
            exit 0
          fi
          if [ "${ok_runs:-0}" = "0" ]; then
            decide true "no successful build run found for tag 'latest' (${base})"
            exit 0
          fi
          if ! changed="$(git diff --no-renames --name-only "$base" HEAD)"; then
            decide true "git diff ${base}..HEAD failed"
            exit 0
          fi

          # UI-only allow-list (case globs: "*" also matches "/", so web/* covers web/**)
          ui_only() {
            case "$1" in
              web/*|docs/*|*.md|tools/visual_qa.py|.github/workflows/deploy-web.yml) return 0 ;;
            esac
            return 1
          }
          native=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! ui_only "$f"; then
              native="${native}${f}"$'\n'
            fi
          done <<< "$changed"

          echo "Files changed since tag latest (${base}):"
          printf '%s\n' "${changed:-(none)}"
          if [ -n "$native" ]; then
            first="$(printf '%s' "$native" | head -n 5 | tr '\n' ' ')"
            decide true "non-UI files changed since ${base}: ${first}"
            exit 0
          fi

          # A UI that needs a newer native build than the published APK (web/min-native-build.json)
          # would be ignored by every device: ship an APK with it instead.
          if ! min_build="$(jq -er '.minBuild | numbers' web/min-native-build.json)"; then
            decide true "web/min-native-build.json has no numeric minBuild"
            exit 0
          fi
          if ! apk_build="$(gh release view latest --json assets --jq '.assets[].name' \
            | sed -n 's/^myAmgi-Pro-\([0-9][0-9]*\)\.apk$/\1/p' | sort -n | tail -n 1)" || [ -z "$apk_build" ]; then
            decide true "could not read the published APK build number from release latest"
            exit 0
          fi
          if [ "$min_build" -gt "$apk_build" ]; then
            decide true "UI needs native build ${min_build} (web/min-native-build.json) but the published APK is build ${apk_build}"
            exit 0
          fi
          decide false "only UI files changed since ${base} (web/**, docs/**, **/*.md, tools/visual_qa.py, deploy-web.yml); UI minBuild ${min_build} <= published APK build ${apk_build}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: steps.mode.outputs.apk_needed != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ~/.myamgi-signing
          key: myamgi-signing-v1

      - name: Prepare signing key
        if: steps.mode.outputs.apk_needed != 'false'
        id: key
        env:
          ALLOW_NEW_SIGNING_KEY: ${{ inputs.allow_new_signing_key && 'true' || 'false' }}
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "SIGNING_STORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using release key from repository secrets"
            exit 0
          fi

          dir="$HOME/.myamgi-signing"
          if [ ! -f "$dir/release.keystore" ] || [ ! -f "$dir/pass" ]; then
            if [ "$ALLOW_NEW_SIGNING_KEY" != "true" ]; then
              echo "::error::No signing key: the repository secrets SIGNING_KEYSTORE_BASE64 etc. are not set and the cached key (actions cache 'myamgi-signing-v1') is missing. A NEW key would make these APKs impossible to install over existing ones; reinstalling deletes the local collection on the device. Restore the old key as repository secrets, or re-run with workflow_dispatch input allow_new_signing_key=true if a new key is really wanted."
              exit 1
            fi
            echo "::warning::No cached signing key found; generating a NEW one (allow_new_signing_key=true). Existing installs signed with an older key must be reinstalled once."
            rm -rf "$dir" && mkdir -p "$dir"
            pass="$(openssl rand -hex 24)"
            printf '%s' "$pass" > "$dir/pass"
            keytool -genkeypair \
              -keystore "$dir/release.keystore" \
              -storetype PKCS12 \
              -alias myamgi \
              -keyalg RSA \
              -keysize 3072 \
              -validity 36500 \
              -storepass "$pass" \
              -keypass "$pass" \
              -dname "CN=myAmgi" > /dev/null
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

          pass="$(cat "$dir/pass")"
          echo "::add-mask::$pass"
          {
            echo "SIGNING_KEYSTORE_FILE=$dir/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$pass"
            echo "SIGNING_KEY_ALIAS=myamgi"
            echo "SIGNING_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"
          echo "Using cached signing key"

      - name: Save new signing key
        if: steps.key.outputs.new == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.myamgi-signing
          key: myamgi-signing-v1

      - name: Show signing certificate fingerprint
        if: steps.mode.outputs.apk_needed != 'false'
        run: |
          # Public information (not a secret): lets the owner pin the expected certificate.
          if fp="$(keytool -list -v -keystore "$SIGNING_KEYSTORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | grep -m1 -E '^[[:space:]]*SHA256:')"; then
            fp="$(printf '%s' "$fp" | sed -E 's/^[[:space:]]+//')"
            echo "Signing certificate ${fp}"
            {
              echo "### Signing certificate"
              echo ""
              echo "\`${fp}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not read the signing certificate fingerprint"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI bundle
        working-directory: web
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Run unit tests (engine host, Pro & Comet)
        if: steps.mode.outputs.apk_needed != 'false'
        run: ./gradlew --stacktrace :core:test :desktop:installDist testProDebugUnitTest testCometDebugUnitTest

      - name: Run unit tests (engine host; OTA-only build)
        if: steps.mode.outputs.apk_needed == 'false'
        run: ./gradlew --stacktrace :core:test

      - name: Build release APKs (Pro & Comet)
        if: steps.mode.outputs.apk_needed != 'false'
        run: ./gradlew --stacktrace assembleProRelease assembleCometRelease

      - name: Collect and rename APKs
        if: steps.mode.outputs.apk_needed != 'false'
        run: |
          mkdir -p dist
          pro_apk="$(find app/build/outputs/apk/pro/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          comet_apk="$(find app/build/outputs/apk/comet/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          if [ -z "$pro_apk" ] || [ ! -f "$pro_apk" ]; then
            echo "::error::Pro release APK not found"
            exit 1
          fi
          if [ -z "$comet_apk" ] || [ ! -f "$comet_apk" ]; then
            echo "::error::Comet release APK not found"
            exit 1
          fi
          cp "$pro_apk" "dist/myAmgi-Pro-${GITHUB_RUN_NUMBER}.apk"
          cp "$comet_apk" "dist/myAmgi-Comet-${GITHUB_RUN_NUMBER}.apk"
          ls -lh dist

      - name: Verify arm64-v8a only native libraries
        if: steps.mode.outputs.apk_needed != 'false'
        run: |
          python3 - "dist/myAmgi-Pro-${GITHUB_RUN_NUMBER}.apk" "dist/myAmgi-Comet-${GITHUB_RUN_NUMBER}.apk" <<'PY'
          import sys
          import zipfile

          forbidden_abis = ("armeabi-v7a", "armeabi", "x86", "x86_64", "mips", "mips64")
          for apk_path in sys.argv[1:]:
              with zipfile.ZipFile(apk_path, "r") as zf:
                  lib_entries = [n for n in zf.namelist() if n.startswith("lib/")]
                  bad = [
                      n for n in lib_entries
                      if not n.startswith("lib/arm64-v8a/")
                      or any(f"lib/{abi}/" in n for abi in forbidden_abis)
                  ]
                  if bad:
                      raise SystemExit(f"{apk_path} contains non-arm64-v8a native libs: {bad}")
                  # The Anki engine cannot start without its JNI library
                  required = "lib/arm64-v8a/librsdroid.so"
                  if required not in lib_entries:
                      raise SystemExit(f"{apk_path} is missing {required}; lib entries: {lib_entries}")
                  if zf.getinfo(required).file_size == 0:
                      raise SystemExit(f"{apk_path} has an empty {required}")
                  for req_asset in ("assets/ui/index.html", "assets/ui/ui-version.json", "assets/ui/card-frame.html"):
                      if req_asset not in zf.namelist():
                          raise SystemExit(f"{apk_path} is missing bundled web UI asset: {req_asset}")
                  print(f"{apk_path}: verified ({len(lib_entries)} lib/arm64-v8a entries incl. librsdroid.so, web UI bundled, no forbidden ABIs)")
          PY

      - name: Generate OTA hot-patch manifest and assets
        if: steps.mode.outputs.apk_needed != 'false'
        run: |
          python3 tools/make_ota_manifest.py \
            --assets-dir app/src/main/assets \
            --out-dir dist \
            --version "${GITHUB_RUN_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --tag update-files
          cp web/dist/ui-version.json dist/ui-version.json
          (cd web/dist && zip -qr "../../dist/ui-bundle.zip" .)
          ls -lh dist

      - name: Prepare OTA-only UI bundle files
        if: steps.mode.outputs.apk_needed == 'false'
        run: |
          mkdir -p dist
          cp web/dist/ui-version.json dist/ui-version.json
          (cd web/dist && zip -qr "../../dist/ui-bundle.zip" .)
          cat dist/ui-version.json
          ls -lh dist

      - name: Make flavor-specific binary delta patches
        if: steps.mode.outputs.apk_needed != 'false' && (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          gh release download latest -p 'myAmgi-Pro-*.apk' -p 'myAmgi-Comet-*.apk' -D old --clobber || true
          gh release download apk-history -p 'myAmgi-Pro-*.apk' -p 'myAmgi-Comet-*.apk' -D old --clobber || true

          for flavor in Pro Comet; do
            new_apk="dist/myAmgi-${flavor}-${GITHUB_RUN_NUMBER}.apk"
            for f in old/myAmgi-${flavor}-*.apk; do
              [ -f "$f" ] || continue
              n="$(basename "$f" .apk)"
              n="${n#myAmgi-${flavor}-}"
              case "$n" in ''|*[!0-9]*) continue ;; esac
              [ "$n" -lt "$GITHUB_RUN_NUMBER" ] || continue
              python3 tools/apk_patch.py make "$f" "$new_apk" \
                "dist/myAmgi-${flavor}-${GITHUB_RUN_NUMBER}.from-${n}.patch" \
                || echo "::warning::Failed or skipped patch for ${flavor} from build ${n}"
            done
          done
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myAmgi-apks
          path: dist/*

      - name: Publish releases (latest = download page, update-files = updater files)
        if: steps.mode.outputs.apk_needed != 'false' && (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local max="$1"; shift
            local attempt=1
            while true; do
              if "$@"; then return 0; fi
              if [ "$attempt" -ge "$max" ]; then return 1; fi
              echo "::warning::Command failed (attempt $attempt/$max), retrying in $((attempt * 4))s..."
              sleep $((attempt * 4))
              attempt=$((attempt + 1))
            done
          }

          n="${GITHUB_RUN_NUMBER}"
          pro_apk="myAmgi-Pro-${n}.apk"
          comet_apk="myAmgi-Comet-${n}.apk"

          # Allow-lists (shell glob patterns). They decide which dist/ files go to which release
          # and which assets may stay there; every other asset is deleted at the very end.
          # When the PC package ships, add its pattern here, e.g. "myAmgi-PC-${n}.zip".
          LATEST_KEEP=("${pro_apk}" "${comet_apk}")
          UPDATE_KEEP=("myAmgi-Pro-${n}.from-*.patch" "myAmgi-Comet-${n}.from-*.patch" "ota-manifest.json" "ota__*" "ui-version.json" "ui-bundle.zip")

          matches() { # name pattern...
            local name="$1" pat; shift
            for pat in "$@"; do
              # Unquoted right-hand side: glob match.
              [[ "$name" == $pat ]] && return 0
            done
            return 1
          }

          # On latest a name is kept by pattern alone (so a PC package uploaded by another job stays).
          # On update-files it must also be a file this run produced (drops ota__ files no longer tracked).
          keep() { # tag name
            case "$1" in
              latest) matches "$2" "${LATEST_KEEP[@]}" ;;
              update-files) matches "$2" "${UPDATE_KEEP[@]}" && [ -f "dist/$2" ] ;;
              *) return 0 ;;
            esac
          }

          upload_new() { # tag file...  (skips assets whose SHA-256 digest is unchanged)
            local tag="$1" existing f bname local_digest; shift
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[] | "\(.name)=\(.digest)"' 2>/dev/null || true)"
            for f in "$@"; do
              bname="$(basename "$f")"
              local_digest="sha256:$(sha256sum "$f" | awk '{print $1}')"
              if printf '%s\n' "$existing" | grep -Fxq "${bname}=${local_digest}"; then
                echo "Skipping unchanged asset on ${tag}: ${bname}"
                continue
              fi
              retry 5 gh release upload "$tag" "$f" --clobber || return 1
            done
          }

          list_assets() { # tag outfile
            gh release view "$1" --json assets --jq '.assets[].name' > "$2"
          }

          prune() { # tag  -- runs last: deletes every asset that keep() rejects
            local tag="$1" list="$RUNNER_TEMP/assets-$1.txt" name
            if ! retry 3 list_assets "$tag" "$list"; then
              echo "::warning::Could not list assets of ${tag}; stale files stay until the next run"
              return 0
            fi
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              keep "$tag" "$name" && continue
              echo "Deleting stale asset from ${tag}: ${name}"
              retry 3 gh release delete-asset "$tag" "$name" --yes \
                || echo "::warning::Could not delete ${name} from ${tag}; next run retries"
            done < "$list"
          }

          latest_files=()
          update_files=()
          for f in dist/*; do
            [ -f "$f" ] || continue
            bname="$(basename "$f")"
            if matches "$bname" "${LATEST_KEEP[@]}"; then
              latest_files+=("$f")
            elif matches "$bname" "${UPDATE_KEEP[@]}"; then
              update_files+=("$f")
            else
              echo "::warning::${bname} matches no release allow-list; not published"
            fi
          done
          if [ ! -f "dist/${pro_apk}" ] || [ ! -f "dist/${comet_apk}" ]; then
            echo "::error::dist/ is missing ${pro_apk} or ${comet_apk}; nothing published"
            exit 1
          fi

          # 1) Updater files first: new builds look for patches/OTA here.
          u_title="앱 자동 업데이트용 파일 (직접 받지 마세요)"
          u_notes="앱이 스스로 업데이트할 때 쓰는 파일입니다. 설치 파일은 latest 릴리스(다운로드 페이지)에서 받으세요."
          if gh release view update-files >/dev/null 2>&1; then
            retry 4 gh release edit update-files --draft=false --prerelease --title "$u_title" --notes "$u_notes" \
              || echo "::warning::update-files metadata edit failed; continuing asset upload"
          else
            retry 5 gh release create update-files \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "$u_title" \
              --notes "$u_notes"
          fi
          if [ "${#update_files[@]}" -gt 0 ]; then
            upload_new update-files "${update_files[@]}" || { echo "::error::Upload to update-files failed"; exit 1; }
          fi

          # 2) Download page: a normal release so GitHub marks it "Latest".
          title="myAmgi 설치 파일 (빌드 ${n})"
          notes="$(cat <<EOF
          | 기기 | 받을 파일 |
          | --- | --- |
          | 휴대폰·태블릿 | ${pro_apk} |
          | 코멧(E-Ink) | ${comet_apk} |

          한 번 설치하면 그다음부터는 앱이 스스로 업데이트합니다.
          EOF
          )"
          if gh release view latest >/dev/null 2>&1; then
            git tag -f latest "${GITHUB_SHA}"
            git push origin refs/tags/latest --force
            retry 4 gh release edit latest --draft=false --prerelease=false --latest --title "$title" --notes "$notes" \
              || echo "::warning::Release metadata edit returned transient error; continuing asset upload"
          else
            retry 5 gh release create latest \
              --target "${GITHUB_SHA}" \
              --latest \
              --title "$title" \
              --notes "$notes"
          fi
          upload_new latest "${latest_files[@]}" || { echo "::error::Upload to latest failed"; exit 1; }

          # 3) Delete stale files last, and only once both current APKs are confirmed on latest.
          if ! retry 3 list_assets latest "$RUNNER_TEMP/latest-check.txt" \
            || ! grep -Fxq "${pro_apk}" "$RUNNER_TEMP/latest-check.txt" \
            || ! grep -Fxq "${comet_apk}" "$RUNNER_TEMP/latest-check.txt"; then
            echo "::error::latest does not list ${pro_apk} and ${comet_apk}; stale files were left in place"
            exit 1
          fi
          prune latest
          prune update-files

      - name: Publish OTA-only UI bundle (update-files; no APK, no prune)
        if: steps.mode.outputs.apk_needed == 'false' && (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local max="$1"; shift
            local attempt=1
            while true; do
              if "$@"; then return 0; fi
              if [ "$attempt" -ge "$max" ]; then return 1; fi
              echo "::warning::Command failed (attempt $attempt/$max), retrying in $((attempt * 4))s..."
              sleep $((attempt * 4))
              attempt=$((attempt + 1))
            done
          }

          for f in dist/ui-bundle.zip dist/ui-version.json; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing; nothing published"
              exit 1
            fi
          done

          if ! gh release view update-files >/dev/null 2>&1; then
            retry 5 gh release create update-files \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "앱 자동 업데이트용 파일 (직접 받지 마세요)" \
              --notes "앱이 스스로 업데이트할 때 쓰는 파일입니다. 설치 파일은 latest 릴리스(다운로드 페이지)에서 받으세요."
          fi

          # Bundle first, version file last: a device that sees the new version finds its bundle.
          # Release `latest`, its tag, apk-history and every other update-files asset stay untouched.
          retry 5 gh release upload update-files dist/ui-bundle.zip --clobber \
            || { echo "::error::Upload of ui-bundle.zip failed"; exit 1; }
          retry 5 gh release upload update-files dist/ui-version.json --clobber \
            || { echo "::error::Upload of ui-version.json failed"; exit 1; }
          echo "Published OTA UI $(cat dist/ui-version.json) to update-files"
          {
            echo "### OTA-only UI published"
            echo ""
            echo "\`$(cat dist/ui-version.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive APK history (newest 10 per flavor)
        if: steps.mode.outputs.apk_needed != 'false' && (github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local max="$1"; shift
            local attempt=1
            while true; do
              if "$@"; then return 0; fi
              if [ "$attempt" -ge "$max" ]; then return 1; fi
              sleep $((attempt * 4))
              attempt=$((attempt + 1))
            done
          }

          gh release view apk-history > /dev/null 2>&1 || retry 4 gh release create apk-history --prerelease \
            --title "이전 빌드 보관 (앱 내 델타 패치 생성용)" \
            --notes "설치용이 아닙니다. 최신 빌드는 latest 릴리스에서 다운로드하세요."

          retry 5 gh release upload apk-history \
            "dist/myAmgi-Pro-${GITHUB_RUN_NUMBER}.apk" \
            "dist/myAmgi-Comet-${GITHUB_RUN_NUMBER}.apk" \
            --clobber

          for flavor in Pro Comet; do
            gh release view apk-history --json assets --jq '.assets[].name' \
              | sed -n "s/^myAmgi-${flavor}-\([0-9]*\)\.apk$/\1/p" \
              | sort -n \
              | head -n -10 \
              | while read -r n; do
                  gh release delete-asset apk-history "myAmgi-${flavor}-${n}.apk" --yes || true
                done
          done

  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.myamgi-signing
          key: myamgi-signing-v1
      - run: ls -la ~/.myamgi-signing 2>/dev/null | sed -n '1,5p' || echo "no cached signing key"
